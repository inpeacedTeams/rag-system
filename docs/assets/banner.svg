  <text x="122" y="79" font-size="27" font-weight="700" fill="#f3f8f3">источник.</text>
  <text x="59" y="147" font-size="12" font-weight="700" letter-spacing="3" fill="#abd0b9">DOCUMENT RAG · BUILT TO VERIFY</text>
