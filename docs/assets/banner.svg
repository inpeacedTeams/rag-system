  <text x="55" y="273" font-size="54" font-weight="700" fill="#c5efcf">Проверяемые ответы.</text>
  <text x="60" y="319" font-size="17" fill="#b4cfc1">PDF / TXT / WEB</text>
  <circle cx="224" cy="313" r="2" fill="#b4cfc1"/>
  <text x="242" y="319" font-size="17" fill="#b4cfc1">BM25 + Qdrant + Kiro</text>
  <g transform="translate(790 92)">
    <rect x="20" y="0" width="265" height="128" rx="16" fill="#f2f7f2"/>
    <rect x="39" y="21" width="35" height="35" rx="9" fill="#dfede3"/>
