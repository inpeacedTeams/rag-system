    <rect x="39" y="78" width="195" height="7" rx="3.5" fill="#cddfd2"/>
    <rect x="39" y="94" width="152" height="7" rx="3.5" fill="#e1ebe4"/>
    <rect x="0" y="145" width="265" height="108" rx="16" fill="#d2efdc"/>
    <text x="20" y="178" font-size="14" font-weight="700" fill="#174c36">Ответ с подтверждением</text>
    <rect x="20" y="194" width="220" height="7" rx="3.5" fill="#93bba2"/>
