<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title description">
<title id="title">Источник: чат с вашими документами</title>
<desc id="description">PDF, TXT и страницы сайта. Проверяемые ответы, точные цитаты, лёгкая архитектура.</desc>
<defs>
  <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#102e26"/><stop offset="1" stop-color="#1d5140"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#93d5b6" stop-opacity=".22"/><stop offset="1" stop-color="#93d5b6" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1200" height="390" rx="28" fill="url(#background)"/>
<circle cx="1020" cy="60" r="260" fill="url(#glow)"/>
<path d="M730 0v390M860 0v390M990 0v390M1120 0v390M680 65h520M680 195h520M680 325h520" stroke="#b5dfc5" stroke-opacity=".07"/>
<g font-family="Arial,Helvetica,sans-serif">
  <rect x="58" y="48" width="47" height="47" rx="13" fill="#c5efcf"/>
