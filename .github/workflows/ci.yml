name: Tests and Docker build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: docker run -d --name qdrant-test -p 127.0.0.1:6333:6333 qdrant/qdrant:v1.14.1
      - run: python -m unittest tests.test_qdrant -v
        env:
          QDRANT_TEST_URL: http://127.0.0.1:6333
      - run: python -m compileall -q app tests
      - run: python -m unittest tests.test_embeddings.RealEmbeddingTests -v
        env:
          RUN_EMBEDDING_INTEGRATION: '1'
      - run: node --check app/static/app.js
      - run: docker build -t document-rag:test .
